ref : "/data/reference.fa"
samples : "config/samples_set1.tsv"  #cahnge it which set you want to use ("config/samples_set1.tsv","config/samples_set2.tsv","config/samples_set2_sampled.tsv")

#Trimmomatic parameters
trimmomatic:
  adapters: "resources/adapters/TruSeq3-PE-2.fa"
  illuminaclip: "2:30:10"
  extra: "LEADING:3 TRAILING:3 SLIDINGWINDOW:4:15 MINLEN:36"

#Flye parameters to change the mode of assembly depending on the type of long reads are being used
flye:
  params:
    PacBio: "--pacbio-raw"
    MinION: "--nano-hq"
    default: "--nano-raw"